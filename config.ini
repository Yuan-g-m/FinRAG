# 该文件用于: 管理整个项目的配置.

# MySQL 配置
[mysql]
host = localhost
user = root
password = change_me
database = finance_kg
port = 3308

# Redis 配置
[redis]
host = localhost
port = 6379
password = change_me
db = 0

# 日志配置
[logger]
log_file = logs/app.log

# Milvus 配置
[milvus]
host = localhost
port = 19530
database_name = finance_rag
collection_name = finrag_final


# LLM 配置
[llm]
model = deepseek-chat
api_key = change_me
base_url = https://api.deepseek.com

# 检索参数配置
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 3
candidate_m = 2
faq_threshold = 0.15

# 应用配置
[app]
app_name = FinRAG智能金融问答系统
tagline = 基于RAG的金融知识智能问答助手
valid_sources = ["股票", "基金", "债券", "银行", "保险"]
customer_service_phone = 400-800-8899
